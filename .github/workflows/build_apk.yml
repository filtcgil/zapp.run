name: Build Flutter APK
on:
  push:
    branches: [ main ] # O il nome della tua branch (es. master)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0' # Versione stabile
          channel: 'stable'
          
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: FiltApp-Installabile
          path: build/app/outputs/flutter-apk/app-release.apk
          
