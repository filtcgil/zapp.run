name: Build Flutter APK
on:
  push:
    branches: [ main ] # Verifica se la tua branch si chiama main o master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Aggiornato a v4
      
      - name: Setup Java
        uses: actions/setup-java@v4 # Aggiornato a v4
        with:
          distribution: 'zulu'
          java-version: '17' # Flutter moderno preferisce Java 17
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      
      - name: Upload APK
        uses: actions/upload-artifact@v4 # RISOLVE L'ERRORE: Aggiornato a v4
        with:
          name: FiltApp-Installabile
          path: build/app/outputs/flutter-apk/app-release.apk
          
